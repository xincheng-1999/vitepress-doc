server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: lax
        secure: false # Local HTTP only. A production HTTPS design must use Secure cookies.
        path: /
spring:
  datasource:
    url: jdbc:h2:mem:session-lab;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: embedded
logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
