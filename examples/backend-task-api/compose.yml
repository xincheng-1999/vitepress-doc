# Local learning only: no authentication. Never expose this API publicly.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: taskapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u taskapp tasks -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/tasks?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: taskapp
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
