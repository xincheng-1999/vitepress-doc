<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">三层分工：分离责任，不制造仪式</title><desc id="desc">Controller负责HTTP，Service负责业务与事务，Repository负责SQL；只有到独立数据库才跨网络。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="610" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">三层分工：分离责任，不制造仪式</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="40" y="120" width="260" height="160" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="152" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Controller</text><text x="60" y="180" font-size="17" fill="#334155" font-weight="400" text-anchor="start">输入 Request DTO</text><text x="60" y="205" font-size="17" fill="#334155" font-weight="400" text-anchor="start">校验、方法 / 状态 / 头</text><text x="60" y="230" font-size="17" fill="#334155" font-weight="400" text-anchor="start">输出 Response DTO</text><rect x="350" y="120" width="260" height="160" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="370" y="152" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Service</text><text x="370" y="180" font-size="17" fill="#334155" font-weight="400" text-anchor="start">可信身份与数据权限</text><text x="370" y="205" font-size="17" fill="#334155" font-weight="400" text-anchor="start">业务规则、事务编排</text><text x="370" y="230" font-size="17" fill="#334155" font-weight="400" text-anchor="start">不保存当前用户字段</text><rect x="660" y="120" width="260" height="160" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="680" y="152" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Repository</text><text x="680" y="180" font-size="17" fill="#334155" font-weight="400" text-anchor="start">参数化 SQL / JDBC</text><text x="680" y="205" font-size="17" fill="#334155" font-weight="400" text-anchor="start">存取与结果映射</text><text x="680" y="230" font-size="17" fill="#334155" font-weight="400" text-anchor="start">连接借还由框架协助</text><polyline points="300,205 340,205" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="610,205 650,205" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="390" width="570" height="125" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="370" y="422" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">数据库是事实源，约束不是 UI 校验</text><text x="370" y="450" font-size="17" fill="#334155" font-weight="400" text-anchor="start">主键、唯一约束、外键、事务与并发规则</text><text x="370" y="475" font-size="17" fill="#334155" font-weight="400" text-anchor="start">同一 Java 进程内三层是方法调用，不是三个微服务</text><polyline points="790,280 790,380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="570" font-size="19" fill="#334155" font-weight="400" text-anchor="start">DTO / Entity / VO 是边界工具，不要机械增设无意义的层和 Impl。</text></g></svg>