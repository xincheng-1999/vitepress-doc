<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">从页面关系到表、约束和索引</title><desc id="desc">用户任务一对多，任务标签通过关联表多对多，联合索引对应实际列表查询。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="560" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">从页面关系到表、约束和索引</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start">这是扩展阶段模型；第一版 H2 只有任务小表。</text><rect x="40" y="115" width="260" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">users</text><text x="60" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">id · 主键</text><text x="60" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">email · 唯一</text><text x="60" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">password_hash · 不外露</text><rect x="350" y="115" width="260" height="190" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="370" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">tasks</text><text x="370" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">id · 主键</text><text x="370" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">owner_id → users.id</text><text x="370" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">title / status / version</text><text x="370" y="250" font-size="17" fill="#334155" font-weight="400" text-anchor="start">created_at / updated_at</text><polyline points="300,180 340,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="160" font-size="16" fill="#334155" font-weight="400" text-anchor="start">1 : N</text><rect x="660" y="115" width="260" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="680" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">tags</text><text x="680" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">id · 主键</text><text x="680" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">name · 标签名</text><rect x="660" y="365" width="260" height="115" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="680" y="397" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">task_tags</text><text x="680" y="425" font-size="17" fill="#334155" font-weight="400" text-anchor="start">task_id + tag_id</text><text x="680" y="450" font-size="17" fill="#334155" font-weight="400" text-anchor="start">组合唯一，连接多对多</text><polyline points="540,305 540,420 650,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="790,255 790,355" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="365" width="460" height="150" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="60" y="397" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">联合索引 · 为查询维护有序目录</text><text x="60" y="425" font-size="17" fill="#334155" font-weight="400" text-anchor="start">(owner_id, status, created_at, id)</text><text x="60" y="450" font-size="17" fill="#334155" font-weight="400" text-anchor="start">先找到用户和状态范围，再读取时间顺序</text><text x="60" y="475" font-size="17" fill="#334155" font-weight="400" text-anchor="start">索引会占空间并增加写入维护成本</text></g></svg>