<svg xmlns="http://www.w3.org/2000/svg" width="960" height="735" viewBox="0 0 960 735" role="img" aria-labelledby="title desc">
<title id="title">一条主线，五个可以验收的阶段</title><desc id="desc">依次学习网络、接口、数据权限、功能异步、部署排错，每阶段以能交付的产物检验。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="735" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">一条主线，五个可以验收的阶段</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start">旧文件编号保留地址；阅读顺序以阶段 A → E 为准。</text><rect x="40" y="105" width="420" height="87" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="137" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">A · 请求与网络</text><text x="60" y="165" font-size="17" fill="#334155" font-weight="400" text-anchor="start">IP / DNS / TCP / TLS / HTTP / 代理</text><polyline points="460,148 500,148" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="113" width="410" height="71" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="530" y="145" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">产物：画出浏览器到数据库的路径</text><polyline points="250,192 250,214" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="219" width="420" height="87" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="251" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">B · 最小语言与接口</text><text x="60" y="279" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Java 17 / Spring / 分层 / CRUD</text><polyline points="460,262 500,262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="227" width="410" height="71" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="530" y="259" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">产物：本机跑通任务 API 和测试</text><polyline points="250,306 250,328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="333" width="420" height="87" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="365" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">C · 数据与权限</text><text x="60" y="393" font-size="17" fill="#334155" font-weight="400" text-anchor="start">SQL / 索引 / 事务 / 登录 / 归属</text><polyline points="460,376 500,376" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="341" width="410" height="71" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="530" y="373" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">产物：别人不能改我的任务</text><polyline points="250,420 250,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="447" width="420" height="87" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="479" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">D · 真实功能与异步</text><text x="60" y="507" font-size="17" fill="#334155" font-weight="400" text-anchor="start">附件 / 导出 / 调度 / 缓存 / 消息</text><polyline points="460,490 500,490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="455" width="410" height="71" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="530" y="487" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">产物：解释需求、失败与恢复</text><polyline points="250,534 250,556" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="561" width="420" height="87" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="593" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">E · 部署与排错</text><text x="60" y="621" font-size="17" fill="#334155" font-weight="400" text-anchor="start">配置 / Docker / 日志 / 备份恢复</text><polyline points="460,604 500,604" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="569" width="410" height="71" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="530" y="601" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">产物：可复现交付与故障证据</text><text x="40" y="705" font-size="19" fill="#334155" font-weight="400" text-anchor="start">先完成一个小单体；JVM 调优、微服务与 Kubernetes 放到选修。</text></g></svg>