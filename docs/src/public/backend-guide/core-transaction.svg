<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">三个问题：原子提交、并发冲突、重复执行</title><desc id="desc">本地事务保护数据库内原子提交，版本条件识别并发更新，跨边界副作用需要另外设计可靠性。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="600" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">三个问题：原子提交、并发冲突、重复执行</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start">幂等防重复业务副作用；它也不是事务的同义词。</text><rect x="40" y="115" width="420" height="250" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="60" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">本地数据库事务</text><text x="60" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">BEGIN</text><text x="60" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">修改 tasks + 写入 task_audit</text><text x="60" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">成功 → COMMIT；失败 → ROLLBACK</text><text x="60" y="250" font-size="17" fill="#334155" font-weight="400" text-anchor="start">范围：同一事务资源，不是所有副作用</text><rect x="520" y="115" width="400" height="250" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="540" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">并发控制 · 另一个问题</text><text x="540" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">A / B 同时读 version=0</text><text x="540" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">UPDATE ... WHERE version=0</text><text x="540" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">一方成功，另一方识别冲突</text><text x="540" y="250" font-size="17" fill="#334155" font-weight="400" text-anchor="start">事务 ≠ 自动防止所有覆盖</text><rect x="40" y="430" width="880" height="125" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="60" y="462" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">HTTP / 邮件 / MQ 不在这个普通本地事务里</text><text x="60" y="490" font-size="17" fill="#334155" font-weight="400" text-anchor="start">数据库提交后，外部发送仍可能失败；外部成功后，数据库也可能失败。</text><text x="60" y="515" font-size="17" fill="#334155" font-weight="400" text-anchor="start">跨边界要设计 outbox、幂等、状态机、补偿和对账，而不是只贴注解。</text><polyline points="250,365 250,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/></g></svg>