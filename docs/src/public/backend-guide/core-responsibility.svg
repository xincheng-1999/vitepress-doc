<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">同一个功能，两侧不同的责任</title><desc id="desc">前端负责用户体验，后端提供可信身份、业务和数据边界，两者通过明确接口契约协作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="570" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">同一个功能，两侧不同的责任</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="40" y="115" width="400" height="220" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">前端 · 用户体验边界</text><text x="60" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">表单提示、交互反馈、loading</text><text x="60" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">页面状态、渲染与错误展示</text><text x="60" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">可以防误操作，但不能防绕过</text><rect x="520" y="115" width="400" height="220" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="540" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">后端 · 可信业务边界</text><text x="540" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">验证身份、动作权限与数据归属</text><text x="540" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">重新校验输入，执行业务规则</text><text x="540" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">并发、持久化、故障与恢复</text><polyline points="440,225 510,225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="449" y="205" font-size="16" fill="#334155" font-weight="400" text-anchor="start">HTTP</text><rect x="270" y="420" width="420" height="110" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="290" y="452" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">共享契约</text><text x="290" y="480" font-size="17" fill="#334155" font-weight="400" text-anchor="start">方法、路径、状态、数据、权限、幂等</text><text x="290" y="505" font-size="17" fill="#334155" font-weight="400" text-anchor="start">体验校验 ≠ 授权；超时 ≠ 没执行</text><polyline points="240,335 240,390 370,390 370,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,335 720,390 590,390 590,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g></svg>