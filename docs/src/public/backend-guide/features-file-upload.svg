<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">私有附件的签名直传与完成校验流程</title>
  <desc id="desc">浏览器先向 task-api 申请上传，服务端校验权限并保存 UPLOADING 元数据后签发短期受限地址。浏览器向私有对象存储直传字节，随后报告完成。task-api 检查对象真实状态、大小和摘要等条件，对确定的对象版本扫描并绑定不可变版本或客户端不可写的最终键，才能标记 READY。下载只能读取已验证版本，旧上传 URL 不得改变已发布内容。下载需要重新授权，失败上传需要清理，签名 URL 不应泄露。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17263c}.title{font-size:28px;font-weight:700}.subtitle{font-size:18px;fill:#334155}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#334155}.arrow{fill:none;stroke:#334155;stroke-width:2.5}</style>
  </defs>
  <rect width="960" height="720" fill="#f8fafc"/>
  <text x="40" y="47" class="title">附件直传：先授权，再传字节，最后验证完成</text>
  <text x="40" y="82" class="subtitle">元数据在 MySQL，字节在私有对象存储；两者不是同一个事务</text>
  <text x="160" y="126" text-anchor="middle" class="head">浏览器</text>
  <text x="480" y="126" text-anchor="middle" class="head">task-api</text>
  <text x="800" y="126" text-anchor="middle" class="head">私有对象存储</text>
  <rect x="40" y="153" width="240" height="94" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="187" class="head">① 申请上传</text>
  <text x="60" y="220" class="body">任务 ID、大小、文件类型</text>
  <path d="M281 200 H356" class="arrow" marker-end="url(#arrow)"/>
  <rect x="360" y="153" width="240" height="94" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="380" y="187" class="head">鉴权 + UPLOADING</text>
  <text x="380" y="220" class="body">生成存储键与受限能力</text>
  <text x="700" y="185" class="body">默认私有，不公开读</text>
  <text x="700" y="216" class="small">客户端不拿永久 AccessKey</text>
  <path d="M480 248 V274 H160 V307" class="arrow" marker-end="url(#arrow)"/>
  <text x="284" y="297" class="small">返回短期、指定对象和动作的签名 URL</text>
  <rect x="40" y="312" width="240" height="94" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="346" class="head">② 持签名能力上传</text>
  <text x="60" y="379" class="body">大文件按需要使用分片</text>
  <path d="M281 359 H676" class="arrow" marker-end="url(#arrow)"/>
  <text x="372" y="342" class="small">文件字节直接传送</text>
  <text x="365" y="391" class="small">不等于业务状态已完成</text>
  <rect x="680" y="312" width="240" height="94" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="346" class="head">保存对象 / 分片</text>
  <text x="700" y="379" class="body">上传失败仍可能留残片</text>
  <rect x="40" y="464" width="240" height="100" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="501" class="head">③ 报告上传完成</text>
  <text x="60" y="535" class="body">客户端报告不是完成证据</text>
  <path d="M281 514 H356" class="arrow" marker-end="url(#arrow)"/>
  <rect x="360" y="464" width="240" height="100" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="380" y="501" class="head">核验 + 必要扫描</text>
  <text x="380" y="535" class="body">固定已扫描版本后 READY</text>
  <path d="M601 514 H676" class="arrow" marker-end="url(#arrow)"/>
  <rect x="680" y="464" width="240" height="100" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="501" class="head">检查真实对象</text>
  <text x="700" y="535" class="body">存在、大小、摘要、状态</text>
  <rect x="40" y="604" width="880" height="82" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="636" class="body">④ 下载重新鉴权，绑定不可变版本 / 最终键；旧上传能力不能覆盖 READY 内容。</text>
  <text x="60" y="666" class="small">失败治理：清理孤儿对象和残片；删除、权限撤销与 CDN 缓存都要定义生效时限。</text>
</svg>
