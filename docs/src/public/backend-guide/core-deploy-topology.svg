<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Compose 部署：地址、端口与数据卷</title><desc id="desc">宿主回环端口转发到API容器，API使用mysql服务名连接内部数据库，数据库文件存于命名卷。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="620" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">Compose 部署：地址、端口与数据卷</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="40" y="120" width="285" height="145" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="152" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">你的电脑 / 浏览器</text><text x="60" y="180" font-size="17" fill="#334155" font-weight="400" text-anchor="start">127.0.0.1:8080</text><text x="60" y="205" font-size="17" fill="#334155" font-weight="400" text-anchor="start">只映射本机，避免公网暴露</text><rect x="390" y="120" width="530" height="145" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="410" y="152" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">api 容器 · task-api:8080</text><text x="410" y="180" font-size="17" fill="#334155" font-weight="400" text-anchor="start">容器内部监听 0.0.0.0</text><text x="410" y="205" font-size="17" fill="#334155" font-weight="400" text-anchor="start">mysql profile → jdbc:mysql://mysql:3306/tasks</text><polyline points="325,190 380,190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="370" width="530" height="145" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="410" y="402" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">mysql 容器 · 内部 3306</text><text x="410" y="430" font-size="17" fill="#334155" font-weight="400" text-anchor="start">不发布宿主数据库端口</text><text x="410" y="455" font-size="17" fill="#334155" font-weight="400" text-anchor="start">命名卷 mysql-data → /var/lib/mysql</text><polyline points="650,265 650,360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="670" y="320" font-size="16" fill="#334155" font-weight="400" text-anchor="start">Compose 网络 / 服务名</text><rect x="40" y="370" width="285" height="145" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="60" y="402" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">镜像 ≠ 数据</text><text x="60" y="430" font-size="17" fill="#334155" font-weight="400" text-anchor="start">镜像：程序与用户态依赖</text><text x="60" y="455" font-size="17" fill="#334155" font-weight="400" text-anchor="start">卷：独立保存数据库文件</text><text x="60" y="480" font-size="17" fill="#334155" font-weight="400" text-anchor="start">备份：需要另存且测试恢复</text><text x="40" y="575" font-size="18" fill="#334155" font-weight="400" text-anchor="start">容器内 localhost 指向自己；down 保留卷，down -v 会删卷，重启测试不等于备份。</text></g></svg>