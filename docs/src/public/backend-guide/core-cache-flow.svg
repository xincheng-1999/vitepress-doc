<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">缓存是旁路，不是正确性的唯一来源</title><desc id="desc">应用授权后先读Redis，未命中读MySQL并回填，数据库提交后失效缓存但仍需处理失败与竞态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="670" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">缓存是旁路，不是正确性的唯一来源</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="40" y="140" width="270" height="145" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="172" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">应用 · 先认证授权</text><text x="60" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">key 包含用户 / 租户</text><text x="60" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">设置回源与等待上限</text><rect x="610" y="140" width="310" height="145" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="630" y="172" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Redis 缓存</text><text x="630" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start">命中：返回允许展示的结果</text><text x="630" y="225" font-size="17" fill="#334155" font-weight="400" text-anchor="start">未命中 / 过期：有限回源</text><polyline points="310,185 600,185" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="415" y="165" font-size="16" fill="#334155" font-weight="400" text-anchor="start">1 · GET</text><polyline points="610,245 320,245" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="268" font-size="16" fill="#334155" font-weight="400" text-anchor="start">命中则返回</text><rect x="40" y="420" width="410" height="145" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="60" y="452" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">MySQL · 事实源</text><text x="60" y="480" font-size="17" fill="#334155" font-weight="400" text-anchor="start">2 · miss 时读库，回填带 TTL 的缓存</text><text x="60" y="505" font-size="17" fill="#334155" font-weight="400" text-anchor="start">写操作：先数据库事务提交</text><polyline points="175,285 175,410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="350" font-size="16" fill="#334155" font-weight="400" text-anchor="start">miss</text><polyline points="450,460 765,460 765,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="440" font-size="16" fill="#334155" font-weight="400" text-anchor="start">3 · 回填 / 提交后失效</text><text x="40" y="625" font-size="18" fill="#334155" font-weight="400" text-anchor="start">DB 提交与缓存失效不是一个原子操作；删失败、慢读回填都要有恢复策略。</text></g></svg>