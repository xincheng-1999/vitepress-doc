<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
<title id="title">第一次排错：先分层，不先重启</title><desc id="desc">按是否有HTTP响应、4xx、代理错误、应用错误分层收集证据，关联请求ID与根因。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="710" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">第一次排错：先分层，不先重启</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="40" y="115" width="290" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">没有 HTTP 响应</text><text x="60" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">DNS → TCP → TLS</text><polyline points="330,165 380,165" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="115" width="530" height="100" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="410" y="147" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">下一步：收集证据</text><text x="410" y="175" font-size="17" fill="#334155" font-weight="400" text-anchor="start">curl 分阶段；查解析、监听、路由与证书</text><rect x="40" y="240" width="290" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="272" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">有 4xx 响应</text><text x="60" y="300" font-size="17" fill="#334155" font-weight="400" text-anchor="start">请求 / 身份 / 业务前置条件</text><polyline points="330,290 380,290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="240" width="530" height="100" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="410" y="272" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">下一步：收集证据</text><text x="410" y="300" font-size="17" fill="#334155" font-weight="400" text-anchor="start">核对方法、Content-Type、认证与归属</text><rect x="40" y="365" width="290" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="397" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">502 / 504</text><text x="60" y="425" font-size="17" fill="#334155" font-weight="400" text-anchor="start">代理到上游的连接 / 响应</text><polyline points="330,415 380,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="365" width="530" height="100" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="410" y="397" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">下一步：收集证据</text><text x="410" y="425" font-size="17" fill="#334155" font-weight="400" text-anchor="start">代理日志 + 应用日志，不能只猜进程死活</text><rect x="40" y="490" width="290" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="522" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">500 / 慢请求</text><text x="60" y="550" font-size="17" fill="#334155" font-weight="400" text-anchor="start">业务 / SQL / 资源 / 下游</text><polyline points="330,540 380,540" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="490" width="530" height="100" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="410" y="522" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">下一步：收集证据</text><text x="410" y="550" font-size="17" fill="#334155" font-weight="400" text-anchor="start">requestId → 根因堆栈 → 分段耗时证据</text><text x="40" y="665" font-size="18" fill="#334155" font-weight="400" text-anchor="start">先记录范围与证据，再做低风险修复；日志不记录密码、token、完整请求体。</text></g></svg>