<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">从最小单体开始，不从全家桶开始</title><desc id="desc">系统分三步演进：内嵌H2跑通链路、独立MySQL提供持久数据、需要时引入缓存消息和存储。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="610" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">从最小单体开始，不从全家桶开始</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start"></text><rect x="35" y="110" width="260" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="55" y="142" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">1 · 先跑通</text><text x="55" y="170" font-size="17" fill="#334155" font-weight="400" text-anchor="start">浏览器 / curl</text><text x="55" y="195" font-size="17" fill="#334155" font-weight="400" text-anchor="start">HTTP → task-api:8080</text><rect x="370" y="110" width="555" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="390" y="142" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">H2 内存库 · 同一 Java 进程</text><text x="390" y="170" font-size="17" fill="#334155" font-weight="400" text-anchor="start">免安装，理解完整链路</text><text x="390" y="195" font-size="17" fill="#334155" font-weight="400" text-anchor="start">重启丢数据；不是生产持久化</text><polyline points="295,165 360,165" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="280" width="260" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="55" y="312" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">2 · 再持久化</text><text x="55" y="340" font-size="17" fill="#334155" font-weight="400" text-anchor="start">task-api 独立进程</text><text x="55" y="365" font-size="17" fill="#334155" font-weight="400" text-anchor="start">JDBC / TCP 访问数据库</text><rect x="370" y="280" width="555" height="110" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="390" y="312" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">MySQL · 事实源</text><text x="390" y="340" font-size="17" fill="#334155" font-weight="400" text-anchor="start">数据库独立运行，数据卷持久化</text><text x="390" y="365" font-size="17" fill="#334155" font-weight="400" text-anchor="start">还要做约束、迁移、备份与恢复</text><polyline points="295,335 360,335" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="450" width="260" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="55" y="482" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">3 · 按问题引入</text><text x="55" y="510" font-size="17" fill="#334155" font-weight="400" text-anchor="start">先测量，不先堆工具</text><text x="55" y="535" font-size="17" fill="#334155" font-weight="400" text-anchor="start">单体也可以多实例部署</text><rect x="370" y="450" width="555" height="110" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="390" y="482" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">缓存 / 后台任务 / 对象存储</text><text x="390" y="510" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Redis 加速，MQ 解耦，Worker 做重活</text><text x="390" y="535" font-size="17" fill="#334155" font-weight="400" text-anchor="start">每多一个依赖，就多一组故障边界</text><polyline points="295,505 360,505" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g></svg>