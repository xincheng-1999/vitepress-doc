<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">从家里登录公司测试服务器的常见过程</title>
  <desc id="desc">先在家里的电脑上连接公司 VPN，接入公司允许访问的内部网络；再登录堡垒机，申请并选择测试服务器；最后建立远程连接，在服务器终端中查日志。连接中转可以由堡垒机本身或单独的跳板机承担，不必再登录另一套工具。图示是本章的常见流程，不要求所有公司采用同一种接入方式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263c}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.arrow{fill:none;stroke:#475569;stroke-width:2.5}</style>
  </defs>
  <rect width="960" height="380" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" class="title">从家里连接测试服务器</text>
  <text x="40" y="84" class="body">按本章的例子，从接入公司网络，到真正进入服务器。</text>
  <rect x="40" y="135" width="170" height="115" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="177" class="head">你的电脑</text>
  <text x="60" y="214" class="body">在家办公</text>
  <path d="M211 192 H256" class="arrow" marker-end="url(#arrow)"/>
  <rect x="260" y="135" width="180" height="115" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="278" y="177" class="head">① 连接 VPN</text>
  <text x="278" y="214" class="body">接入公司内网</text>
  <path d="M441 192 H486" class="arrow" marker-end="url(#arrow)"/>
  <rect x="490" y="135" width="200" height="115" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text x="508" y="177" class="head">② 登录堡垒机</text>
  <text x="508" y="214" class="body">申请并选择测试机</text>
  <path d="M691 192 H736" class="arrow" marker-end="url(#arrow)"/>
  <rect x="740" y="135" width="180" height="115" rx="12" fill="#fff7ed" stroke="#d97706"/>
  <text x="758" y="177" class="head">③ 进入服务器</text>
  <text x="758" y="214" class="body">打开终端查日志</text>
  <text x="40" y="301" class="body">其中的连接中转，可由堡垒机本身或单独的跳板机完成。</text>
  <text x="40" y="341" class="body">跳板机负责中转；堡垒机平台通常还会管理访问权限、记录操作。</text>
</svg>
