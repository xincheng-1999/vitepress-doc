<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
<title id="title">一次同步请求，从字节到数据再返回</title><desc id="desc">按网络、过滤器、MVC、业务、数据库五层跟踪请求，区分异常处理边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="960" height="710" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="32" y="45" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">一次同步请求，从字节到数据再返回</text><text x="32" y="76" font-size="17" fill="#334155" font-weight="400" text-anchor="start">基线是同步 Spring MVC；不是所有后端都使用相同线程模型。</text><rect x="40" y="110" width="625" height="83" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="142" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">浏览器 / curl / 可选代理</text><text x="60" y="170" font-size="17" fill="#334155" font-weight="400" text-anchor="start">传输 HTTP 字节；代理与应用是不同连接</text><polyline points="345,193 345,210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="215" width="625" height="83" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="247" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Tomcat + Servlet Filter</text><text x="60" y="275" font-size="17" fill="#334155" font-weight="400" text-anchor="start">监听、请求 ID、日志与安全过滤器链</text><polyline points="345,298 345,315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="320" width="625" height="83" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="352" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">DispatcherServlet + MVC</text><text x="60" y="380" font-size="17" fill="#334155" font-weight="400" text-anchor="start">路由匹配 → Interceptor → JSON 绑定 / 校验</text><polyline points="345,403 345,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="425" width="625" height="83" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="457" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Controller → Service</text><text x="60" y="485" font-size="17" fill="#334155" font-weight="400" text-anchor="start">协议适配 → 授权、业务规则与事务边界</text><polyline points="345,508 345,525" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="530" width="625" height="83" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="60" y="562" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Repository / JDBC → 数据库</text><text x="60" y="590" font-size="17" fill="#334155" font-weight="400" text-anchor="start">参数化 SQL、借还连接、提交或回滚</text><rect x="700" y="110" width="220" height="150" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="720" y="142" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">网络 / 代理错误</text><text x="720" y="170" font-size="17" fill="#334155" font-weight="400" text-anchor="start">可能没有 HTTP</text><text x="720" y="195" font-size="17" fill="#334155" font-weight="400" text-anchor="start">502 / 504 看上游</text><text x="720" y="220" font-size="17" fill="#334155" font-weight="400" text-anchor="start">不能推断已回滚</text><rect x="700" y="320" width="220" height="195" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="720" y="352" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">MVC 异常边界</text><text x="720" y="380" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Advice 映射异常</text><text x="720" y="405" font-size="17" fill="#334155" font-weight="400" text-anchor="start">不兜所有 Filter</text><text x="720" y="430" font-size="17" fill="#334155" font-weight="400" text-anchor="start">不兜后台 Worker</text><text x="720" y="455" font-size="17" fill="#334155" font-weight="400" text-anchor="start">响应保留请求 ID</text><text x="40" y="675" font-size="19" fill="#334155" font-weight="400" text-anchor="start">提交成功后仍可能响应丢失：客户端超时，不代表业务没有执行。</text></g></svg>