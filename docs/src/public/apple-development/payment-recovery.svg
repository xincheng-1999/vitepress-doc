<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">支付异常和恢复流程</title><desc id="desc">取消不发权益；pending 等待；苹果成功后网络失败保留交易，恢复验单，幂等发放并 finish。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#44637e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/>
<text x="35" y="50" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="29" fill="#17334b" text-anchor="start">购买结果不能只有“成功 / 失败”</text>
<rect x="35" y="100" width="930" height="104" rx="12" fill="#fff" stroke="#b9cbdc"/>
<text x="57" y="137" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="23" fill="#17334b" text-anchor="start">用户取消</text>
<text x="57" y="177" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="20" fill="#17334b" text-anchor="start">不发放权益 → 结束本次 UI 等待 → 允许用户再次主动操作</text>
<rect x="35" y="235" width="930" height="104" rx="12" fill="#fff4db" stroke="#b9cbdc"/>
<text x="57" y="272" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="23" fill="#17334b" text-anchor="start">Pending / 待批准</text>
<text x="57" y="312" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="20" fill="#17334b" text-anchor="start">保留等待状态 → 监听后续交易更新 → 不自动重复购买</text>
<rect x="35" y="370" width="930" height="104" rx="12" fill="#fff4db" stroke="#b9cbdc"/>
<text x="57" y="407" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="23" fill="#17334b" text-anchor="start">苹果成功，后端暂时不可用</text>
<text x="57" y="447" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="20" fill="#17334b" text-anchor="start">保存关联 → 不假报失败或再次扣款 → 等待恢复补验</text>
<path d="M500 474 L500 503" fill="none" stroke="#44637e" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="35" y="505" width="930" height="104" rx="12" fill="#e8f4ed" stroke="#b9cbdc"/>
<text x="57" y="542" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="23" fill="#17334b" text-anchor="start">重启 / 网络恢复 / 交易更新</text>
<text x="57" y="582" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="20" fill="#17334b" text-anchor="start">读取未完成交易 → 核对账号归属 → 查询并校验同一笔交易</text>
<path d="M500 609 L500 638" fill="none" stroke="#44637e" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="35" y="640" width="930" height="104" rx="12" fill="#e8f4ed" stroke="#b9cbdc"/>
<text x="57" y="677" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="23" fill="#17334b" text-anchor="start">服务端确认已处理</text>
<text x="57" y="717" font-family="system-ui, -apple-system, PingFang SC, sans-serif" font-size="20" fill="#17334b" text-anchor="start">幂等发权益 → finish → 刷新会员资料 → 页面呈现结果</text>
</svg>